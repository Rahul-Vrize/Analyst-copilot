# The Analyst Copilot — all tunables in one place.
# Secrets and connection strings live in .env, never here.
# Source of truth: IMPLEMENTATION_PLAN.md §20.6

profile: prod            # dev == prod (D15) — so abstention thresholds need no
                         # re-calibration between development and submission.

# ─────────────────────────────────────────────────────────────────────────────
# MODELS — per-stage binding (D15). Deployment names come from .env.
# Extraction is 78% of all input tokens, so the cheap model earns its keep there.
# Verification is only 9%, and a DIFFERENT FAMILY at the generate→verify seam is
# what preserves D4 independence. Never point verifier_b at the extractor's model:
# that is self-verification, not verification.
# ─────────────────────────────────────────────────────────────────────────────
# reasoning_effort / verbosity / max_completion_tokens per stage — see §23.4.
# ⚠️ gpt-5-mini is a REASONING model: it spends completion tokens on hidden
# reasoning BEFORE emitting content. A budget sized for the visible answer alone
# returns content='' with finish_reason='length' AND NO ERROR. Measured: 64
# reasoning tokens on a trivial prompt. Always leave headroom.
# Context window is 400K, so assembly size is not a constraint.
#
# ⚠️ THE REASONING STAGES RUN AT 4000, NOT 2000, AND THAT IS A MEASURED NUMBER.
# ✅ MEASURED on the Amazon DPO question: verifier_b returned content='' with
# finish_reason='length' and reasoning_tokens=2000 — it spent its ENTIRE budget
# on hidden reasoning and never emitted a verdict. `_one_verdict` fails closed,
# so the question abstained and the trace read "verifier:b": a CONFIG problem
# wearing the costume of a refusal, which is exactly the kind of artifact that
# makes an abstention rate meaningless. Raise, never lower, without measuring.
models:
  router:         {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: low,     verbosity: low, max_completion_tokens: 1000}
  planner:        {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: medium,  verbosity: low, max_completion_tokens: 2000}
  query_rewrite:  {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: low,     verbosity: low, max_completion_tokens: 1000}
  section_titles: {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: low,     verbosity: low, max_completion_tokens: 8000}
  summarizer:     {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: minimal, verbosity: low, max_completion_tokens: 1000}
  extractor:      {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: medium,  verbosity: low, max_completion_tokens: 8000}
  # The ANSWER stage. 62% of gold answers are non-numeric, so a bare figure is
  # the wrong shape for most questions; this stage writes the answer from the
  # quotes alone. Higher reasoning than extraction because choosing WHAT answers
  # the question is the judgement, not finding the figures.
  composer:       {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: medium,  verbosity: low, max_completion_tokens: 4000}
  formula_pick:   {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: medium,  verbosity: low, max_completion_tokens: 4000}
  verifier_a:     {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: medium,  verbosity: low, max_completion_tokens: 4000}
  verifier_b:     {provider_env: VERIFIER_B_PROVIDER, deployment_env: VERIFIER_B_DEPLOYMENT,
                   reasoning_effort: medium,  verbosity: low, max_completion_tokens: 4000}
  # EVAL ONLY - grades free-text answers against gold. 62% of gold answers are
  # non-numeric, so without this the harness scores them all wrong. Never used
  # by the pipeline: the judge grades, it does not help the system answer.
  judge:          {provider: azure_openai, deployment_env: GPT_DEPLOYMENT,
                   reasoning_effort: medium,  verbosity: low, max_completion_tokens: 4000}
  embeddings:    {provider: azure_openai, deployment_env: EMBEDDING_DEPLOYMENT,
                  dimensions: 1024}   # MUST equal EMBEDDING_DIMENSIONS and pages.embedding vector(1024)
  reranker:      {provider: cohere_foundry, endpoint_env: COHERE_RERANK_ENDPOINT,
                  model: Cohere-rerank-v4.0-pro}

# ─────────────────────────────────────────────────────────────────────────────
# ROUTING (§14.4, §22.2)   measured: top-1 94.1% / top-2 97.1% / top-4 98.5%
# ─────────────────────────────────────────────────────────────────────────────
routing:
  top_k_filings: 4              # D11 — be generous here, strict at verification
  clarify_when_no_company: true # 2/136 questions name no company
  reroute_max: 1                # ⚠️ READ BUT NEVER ACTED ON — the confirmation
                                # gate (§14.4 stage 0c) is not implemented. Kept
                                # so the intent is visible; it changes nothing today.
  fallback_next_4: false        # Decision E: escalate by DEPTH, not breadth.
                                # top-4 and top-8 both hit 134/136 — more filings
                                # adds nothing. Kept for unseen uploads only.
  prefer_coverage_years: true   # once populated, supersedes Rule A's heuristic

# ─────────────────────────────────────────────────────────────────────────────
# RETRIEVAL (§4, §20.1)
# ─────────────────────────────────────────────────────────────────────────────
retrieval:
  bm25_top_k: 20                # tier 1 — measured 85.7% recall with anchors
  bm25_top_k_escalated: 40      # tier 2 — measured 84.1% assembled at router top-4
  dense_top_k: 20
  rrf_k: 60                     # score(d) = Σ 1/(60 + rank)
  rerank_top_n: 15
  assembly_token_budget: 42000  # gpt-5-mini context = 400K, so ~10x headroom.
                                # Raise only if eval shows recall-bound failures.
  neighbour_expand: 1           # ±1 page in tier 1, ±2 when escalated
  use_reranker: true            # ablation flag — false isolates the reranker's lift

  # ⚠️ THIS COMMENT USED TO SAY "FALSE BECAUSE IT IS NOT BUILT". It is built now.
  # `retrieval/dense.py` holds the page vectors in memory and `_retrieve` fuses
  # them as a THIRD RRF ranking, always scoped to the routed candidates.
  #
  # ✅ MEASURED, 127 questions with a mapped gold page:
  #     dense@20 alone, oracle doc ............ 74.8% from 19.9 pages
  #     anchors + BM25, router top-4 .......... 85.0%
  #     anchors + BM25 + dense, router top-4 .. 88.2%   <- tier 1 now equals
  #     escalated BM25@40, router top-4 ....... 88.2%      what tier 2 reached,
  #                                                        from 87 pages not 119
  #
  # Setting this false is a real ablation now, not a no-op. It also degrades
  # safely on its own: with `pages.embedding` unpopulated the index is empty and
  # the stack falls back to anchors + BM25 rather than erroring.
  use_dense: true

# ─────────────────────────────────────────────────────────────────────────────
# VERIFICATION (§20.2) — deterministic gates first, then two independent verifiers
# ─────────────────────────────────────────────────────────────────────────────
verification:
  # G1b is deterministic proof that the reported figure appears IN its quote.
  # G1 proves the quote is on the page; G1b proves the quote carries the number.
  # Measured: without it, a label-only quote passed every gate and was then
  # rejected by both LLM verifiers, costing a full escalation round.
  enabled_gates: [G1, G1b, G2, G3, G4, G5, G6, G7]
  require_all_gates: true       # any failure ⇒ abstain. These are DETERMINISTIC
                                # and family-independent — they do most of the work.
  # ⚠️ LLM VERIFICATION IS OFF. The brief requires an answer with its location
  # or an honest decline; it does not require a verifier — that was our design
  # choice, and this turns it off.
  #
  # ✅ MEASURED on 25 stratified questions, so the cost is known and accepted:
  #      verifiers ON   12/25 answered, +1=9  -1=3  net +6, 75% accurate, 61 s
  #      verifiers OFF  20/25 answered, +1=12 -1=8  net +4, 60% accurate, 41 s
  # Gates-only answers 8 more questions and gets 5 of them wrong. Set this back
  # to `true` to restore the higher-scoring, slower configuration.
  #
  # THE DETERMINISTIC GATES G1-G7 ARE UNAFFECTED and still run: a quote must
  # still appear verbatim on its cited page (G1), the figure must appear inside
  # its own quote (G1b), and the arithmetic must still recompute (G6). Those do
  # most of the grounding work and cost nothing.
  use_verifiers: false
  verifier_policy: unanimous    # applies only when use_verifiers is true

  # ── VERIFIER INDEPENDENCE ────────────────────────────────────────────────
  # D4 wanted two model FAMILIES at the generate→verify seam. A and B are both
  # gpt-5-mini today, so independence comes from ADVERSARIAL FRAMING plus context
  # isolation, not from architecture. That is a real weakness, and it is measured:
  # ✅ 9 of 14 declines in the 25-question baseline were verifier rejections,
  # 4 of them by verifier B alone.
  #
  # ⚠️ CLAUDE IS NOT AVAILABLE ON THIS SUBSCRIPTION — this is a BILLING-MODEL
  # exclusion, not a quota shortage, and the distinction matters because no
  # amount of waiting or asking fixes it. Claude on Microsoft Foundry bills
  # through Azure Marketplace, and Microsoft's docs exclude "student, free trial,
  # or startup credit-based accounts" and "sponsored subscriptions that only use
  # Azure credits" from purchasing it. Adding a card does not redeem the Azure
  # credit either: the docs state the card is charged INSTEAD of the credits.
  # So the original plan (D15: claude-haiku-4-5 as verifier B) cannot run here,
  # and llm/anthropic_foundry.py is dead code on this account.
  #
  # ✅ THE SECOND FAMILY IS STILL AVAILABLE, just not from Anthropic. Grok,
  # DeepSeek, Llama, Mistral and Moonshot are "sold by Azure" — no Marketplace
  # purchase — and are served by the SAME /openai/v1 Foundry route through the
  # OpenAI SDK, so they need no new adapter. Deploy one, then:
  #   VERIFIER_B_PROVIDER=azure_openai
  #   VERIFIER_B_DEPLOYMENT=grok-4.1-fast-reasoning   # or DeepSeek-V3.2
  # and DROP reasoning_effort/verbosity from models.verifier_b below — those are
  # OpenAI-only. The adapter degrades automatically if you forget
  # (see llm/azure_openai.py::_degrade), but explicit config is cheaper.
  #
  # ⚠️ When B is a genuine second family, set adversarial: false — refutation
  # framing is a SUBSTITUTE for independence, not an addition to it. Running both
  # over-abstains. Re-calibrate thresholds after any such switch.
  # ⚠️ THIS SAID `different_family` AND CLAIMED "✅ ACHIEVED: verifier_b is
  # Amazon Nova Pro on Bedrock". IT IS NOT. `VERIFIER_B_DEPLOYMENT` resolves to
  # gpt-5-mini, so both verifiers are the same model and independence comes from
  # ADVERSARIAL FRAMING plus context isolation — not architecture.
  #
  # ✅ WHY NOVA WAS REVERTED, MEASURED: a genuine second family was tried and was
  # WORSE. Nova Pro as verifier B gave a 60% false-answer rate on the first
  # batch, twice, with and without adversarial framing. A 17-case bake-off put
  # it at 3/7 wrong answers caught but only 4/10 correct answers KEPT, against
  # gpt-5-mini's 2/7 and 8/10. Llama 3.3 70B errored on 16 of 17.
  #
  # The conclusion is the useful part: INDEPENDENCE AND COMPETENCE ARE SEPARATE
  # AXES. A second family buys independence and is worthless if it cannot judge.
  # The swap path stays three lines in `.env` — see VERIFIER_B_PROVIDER.
  independence: same_model_adversarial
  # ⚠️ TRUE, AND THE PLAN'S OWN ADVICE TO TURN IT OFF IS WRONG FOR THIS SYSTEM.
  # IMPLEMENTATION_PLAN says "when B is a genuine second family, set adversarial:
  # false - running both over-abstains". We now HAVE a genuine second family
  # (Amazon Nova Pro vs gpt-5-mini) and ✅ MEASURED that advice directly:
  #
  #   adversarial: false  ->  batch of 5: score -2, mean -0.400,
  #                           FALSE-ANSWER RATE 60% (3 of 5 wrong)
  #   adversarial: true   ->  25 questions: score +7, mean +0.280,
  #                           false-answer rate 12%
  #
  # In all three wrong answers BOTH verifiers returned VALID - including "Yes" to
  # a capital-intensity question whose gold answer is "No". All three had been
  # honest DECLINES under adversarial framing. The framing was not a crutch for
  # missing independence; it is doing load-bearing work, because this extractor
  # produces plausible-looking wrong answers that a merely-neutral verifier
  # accepts. Independence and skepticism turn out to be separate properties.
  verifier_b_adversarial: true
  abstain_string: "Not found in this filing."   # NEVER paraphrase this

# ─────────────────────────────────────────────────────────────────────────────
# INGEST (§21.1)
# ─────────────────────────────────────────────────────────────────────────────
ingest:
  # ⚠️ BOTH FALSE BECAUSE THEY ARE NOT BUILT. Same reasoning as retrieval.use_dense
  # above: `ingest/pipeline.py` writes `summary: None` unconditionally and makes
  # no LLM call for section titles. A config that claims a stage the code does
  # not run is worse than one that admits the gap — it misdirects tuning.
  llm_title_cleanup: false      # would fix span-split titles ('ITEM 1. B USINESS')
  page_summaries: false         # ~$15 one-off for all 8,389 pages when built
  min_page_chars: 40            # page-splitter fragment merge threshold — a seam is
                                # often marked by BOTH <hr> AND page-break CSS
  table_min_rows: 3             # data-table gate; 46% of <table> are layout artifacts
  table_min_numeric_cells: 2
  # ✅ REAL: 80,327 facts extracted, each carrying its page and the row label
  # displayed in the filing. Costs 1.7 s even on the 15.9 MB JPMorgan 10-K.
  # ⚠️ BUT NOT YET READ AT QUERY TIME — no module under query/ or retrieval/
  # touches the `facts` table, so this contributes nothing to the score today.
  xbrl: true                    # first-class fact path (D8 revised)
  xbrl_exclude_dimensional: true# segment/geography facts excluded by default
  max_concurrency: 16           # summarisation + embedding batching

# ─────────────────────────────────────────────────────────────────────────────
# EVAL (§20.3) — four answer shapes, four predicates, reported separately
# ─────────────────────────────────────────────────────────────────────────────
eval:
  numeric_tolerance: 0.005      # ±0.5% relative
  location_containment: 0.6     # cited page text vs gold evidence_text
  page_seq_slack: 1             # derived page within ±1 of mapped gold page
  gold_map_min_jaccard: 0.35    # 126/136 questions map at this threshold
  split_by: company             # NEVER by question — boilerplate would leak
  report_by_answer_shape: true  # 52 numeric / 35 yes-no / 26 phrase / 23 multi-sentence

  # Token prices for the batch runner's spend report (scripts/run_batches.py).
  # ⚠️ DELIBERATELY UNSET. Tokens are measured exactly; dollars are only ever
  # derived from a rate someone has confirmed. Fill these in from YOUR Azure
  # pricing blade for the gpt-5-mini deployment — a guessed rate would produce a
  # confident budget number that is silently wrong, which is worse than none.
  # With them unset the runner reports tokens and --max-tokens still works.
  pricing:
    input_per_mtok:            # e.g. 0.25   (USD per 1M input tokens)
    output_per_mtok:           # e.g. 2.00   (USD per 1M output tokens)
